# DSH profile patch layer, applied after every bundle layer: a top-level YAML
# array of loader patch entries (id-targeted overrides, disables, inserts).
#
# The preset-academic block below is generated by gen-preset.py from the
# installed DSH's shipped preset-standard. Re-derive it after every DSH upgrade,
# do not hand-patch the plugin list:
#
#   python <repo>/preset/gen-preset.py --from-cli \
#       --cnki-dir <repo>/servers/cnki-search \
#       --update-patch <this file>
#
# Entries outside the markers are your own and are left untouched.

# >>> preset-academic >>> generated by gen-preset.py -- do not edit inside the markers
- insert:
    - id: preset-academic
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: academic
        name: 学术研究
        description: 文献检索、综述与学术写作的研究助手
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an academic research assistant powered by the {{model}} model. Ground every claim about the literature in output actually returned by the available tools (mcp__cnki__*, mcp__arxiv__*, mcp__pubmed__*, mcp__semantic-scholar__*, read_page, web_search); never fabricate a title, author, year, DOI, venue, volume or page range, and say plainly when a tool cannot confirm something. Distinguish what a source states from your own inference, quote precisely where wording matters, and answer in the user's language. Treat publication status as part of the finding. Label a record as preprint, conference paper or journal article as the source reports it, and let the current date from the time context decide what counts as recent rather than your training cutoff. For every CNKI record, cite the link in its url field (a kns.cnki.net main-site link, which is what can be opened and downloaded from) and never the space_url field or any cnki.com.cn 知网空间 link; if a record carries no kns.cnki.net link, say the main-site link is unavailable instead of offering the 知网空间 page. The CNKI source exposes no DOI, so never infer one from it. Identify a CNKI record by its space_url or its dbcode and filename, never by its title, since a CNKI title search is fuzzy recall; when a record is already known by a link, re-read it with get_record instead of searching again. Never hand-build a kns.cnki.net link from a 知网空间 URL -- an invented filename still answers HTTP 200 -- so take dbcode and filename only from tool output.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Stay in plan mode until the user approves
                    your plan through exit_plan_mode or switches the session mode.
                    Imperative language to implement changes means plan the
                    implementation, not execute it. A user's conversational
                    agreement — including an answer confirming something you asked —
                    approves nothing and does not end plan mode; fold the confirmed
                    decision into the plan and submit it through exit_plan_mode.


                    Explore first. Use non-mutating reads, searches, static
                    analysis, and checks to ground the plan in the actual
                    repository. Do not edit or write files, change configuration,
                    run formatters or code generation that rewrites tracked files,
                    commit, or otherwise carry out the plan. Prefer existing
                    functions and patterns over new machinery.


                    The tool catalog stays the same across modes for request-cache
                    stability. These plan-mode rules override any later tool
                    description or guidance that suggests using mutation tools;
                    those tools remain listed to keep the tool catalog unchanged. Do
                    not use todo_write to track this planning phase: it tracks
                    implementation after an approved plan, while the plan itself
                    belongs in exit_plan_mode.


                    Resolve discoverable facts by inspection. Use ask_user_question
                    only for user-owned choices or material ambiguity that
                    inspection cannot answer. Do not ask the user where code lives
                    or how current behavior works when you can find out.


                    Make the plan decision-complete: state the goal and success
                    criteria; group implementation changes by subsystem; identify
                    public API, schema, and data-flow changes; cover edge cases,
                    failure modes, tests, acceptance criteria, and explicit
                    assumptions. Keep it concise enough to review but detailed
                    enough that another engineer can implement it without making
                    design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown,
                    starting with a # title. Make exit_plan_mode the only and final
                    tool call in that assistant response: it presents the plan for
                    approval, and implementation begins only in a later step after
                    approval. Do not paste the final plan as a plain reply or ask
                    "should I proceed?" through prose or ask_user_question. If
                    review rejects it, incorporate the feedback and present again.
                    If the review channel is unavailable or aborted, stay in plan
                    mode and ask the user to switch modes manually; do not proceed
                    with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true  # academic sessions do not install plugins on the model's behalf
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          # ===================== literature sources (MCP) =====================
          # Tool names are mcp__<serverName>__<tool>. A preset is mounted eagerly
          # when the host starts, so these processes live as long as the app runs;
          # only sessions that select this preset see the tools.
          #
          # --- CNKI 题录检索 --------------------------------------------
          # Server: servers/cnki-search in this repo, a fork of
          # https://github.com/Biogod2020/cnki-search that maps the returned link
          # from 知网空间 (cnki.com.cn) to the download-capable main site:
          #   https://kns.cnki.net/kcms/detail/detail.aspx?dbcode=<dbcode>&filename=<filename>
          # The original 知网空间 link is kept in space_url for get_record only.
          # The endpoint carries no DOI and no full text; whether a PDF can be
          # downloaded depends on your institution's IP / login state, not on the
          # link itself. See servers/cnki-search/CHANGES.md for the mapping rules.
          #
          # failOnStartupError stays false for every source: they are started from
          # remote packages (uvx / npx) or a local venv, and a transient failure
          # would otherwise veto the whole session with
          # "initial connection or tool synchronization failed". With false, the
          # source's tools simply do not appear and the session keeps working.
          - id: mcp-cnki
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: cnki
              transport: stdio
              command: uv
              args:
                - run
                - --directory
                - "C:/Users/you/.dsh/cnki-kns"
                - cnki-search
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          # --- arXiv ---------------------------------------------------
          # Published PyPI package; full-text and section-level reading.
          - id: mcp-arxiv
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: arxiv
              transport: stdio
              command: uvx
              args:
                - arxiv-mcp-server
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          # --- PubMed / Europe PMC -------------------------------------
          # npx on Windows is a .cmd shim, which Node's spawn cannot resolve
          # directly (bare 'npx' gives ENOENT, 'npx.cmd' gives EINVAL), so it is
          # forwarded through cmd /c.
          - id: mcp-pubmed
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: pubmed
              transport: stdio
              command: cmd
              args:
                - /c
                - npx
                - -y
                - '@cyanheads/pubmed-mcp-server'
              toolCallTimeoutMs: 60000
              failOnStartupError: false
          # --- Semantic Scholar ----------------------------------------
          # Citation graph, similar-paper recommendations and export_bibtex.
          # Anonymous calls share a rate-limited pool; set
          # SEMANTIC_SCHOLAR_API_KEY in the host environment to raise the limit.
          # mcp-client strips environment variables whose name contains KEY, so
          # the variable has to be merged back explicitly here.
          - id: mcp-semantic-scholar
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: semantic-scholar
              transport: stdio
              command: uvx
              args:
                - --from
                - git+https://github.com/akapet00/semantic-scholar-mcp
                - semantic-scholar-mcp
              env: !!js 'process.env.SEMANTIC_SCHOLAR_API_KEY ? { SEMANTIC_SCHOLAR_API_KEY: process.env.SEMANTIC_SCHOLAR_API_KEY } : {}'
              toolCallTimeoutMs: 60000
              failOnStartupError: false
# <<< preset-academic <<<
